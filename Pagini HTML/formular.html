<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75,900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75,300&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="/Poze/favicon.png">

    <link rel="stylesheet" href="/Pagini HTML/formular.css">
    <script src="/header.js" defer></script>
    <script src="/Pagini HTML/formular.js" defer></script>
</head>
<body>
    <main class="main">
        <article class="main__form">
            <form id="form" class="form" method="get" novalidate>
                <label for="numele-colectiei" class="form__field">
                    Numele colecției *
                    <textarea id="numele-colectiei" name="numele-colectiei" placeholder="Introdu numele colecției.." required data-type="text"></textarea>
                </label>

                <label for="scurta-descriere" class="form__field">
                    Descrierea colecției *
                    <textarea id="scurta-descriere" placeholder="Introdu descriere..." required data-type="text"></textarea>
                </label>

                <label for="poza-colectie" class="form__field">
                    Poza colecției *
                    <input id="poza-colectie" accept="image/*" type="file" name="poza-colectie" required data-type="file">
                </label>

                <label for="consimtamant" class="form__field">
                    Esti de acord cu prelucrarea datelor introduse *
                    <input id="consimtamant" type="checkbox" required data-type="checkbox">
                </label>

                <button type="submit" class="form__submit">Submit</button>
            </form>

            <div class="preview">
                <h2 class="preview__text">Preview: </h2>
                <img id="preview" class="preview__imagine" src="/Poze/Contact/background.webp" alt="Introdu o imagine">
            </div>
        </article>
    </main>
</body>
</html>
